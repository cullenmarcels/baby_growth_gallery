name: Quality

on:
  pull_request:
    branches: [develop, release, master, main]
  push:
    branches: [develop]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm photo:dependencies:check
      - run: pnpm --filter @baby-growth-gallery/api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify deterministic OpenAPI client
        run: pnpm api:generate && git diff --exit-code -- packages/api-client
      - run: pnpm build
      - name: Build the Alpine API image with image codecs
        run: docker build --file apps/api/Dockerfile --tag baby-growth-gallery-api:ci .
      - name: Verify sharp and the HEIC WASM decoder load in Alpine
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/apps/api/test/fixtures:/fixtures:ro"
          --env PHOTO_FIXTURE_DIR=/fixtures
          --entrypoint node baby-growth-gallery-api:ci scripts/verify-photo-codecs.mjs
      - name: Validate project knowledge base
        shell: pwsh
        run: ./hooks/validate-project.ps1 -Check

  e2e-auth:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: baby_growth_gallery
          POSTGRES_USER: baby_gallery
          POSTGRES_PASSWORD: baby_gallery_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baby_gallery -d baby_growth_gallery"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://baby_gallery:baby_gallery_test_password@127.0.0.1:5432/baby_growth_gallery
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_KEY_PREFIX: bgg-ci
      AUTH_SESSION_SECRET: ci-session-secret-that-is-not-for-production-use
      AUTH_HMAC_SECRET: ci-hmac-secret-that-is-not-for-production-use-now
      AUTH_COOKIE_SECURE: 'false'
      VERIFICATION_DELIVERY_MODE: fixed
      TEST_VERIFICATION_CODE: '246810'
      WEB_ORIGIN: http://127.0.0.1:5173
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9002
      S3_REGION: us-east-1
      S3_BUCKET: baby-growth-gallery-ci
      S3_ACCESS_KEY_ID: baby_gallery_minio
      S3_SECRET_ACCESS_KEY: baby_gallery_minio_ci_password
      S3_FORCE_PATH_STYLE: 'true'
      PHOTO_PROCESSING_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Start pinned private MinIO
        run: |
          docker network create bgg-photo-ci
          docker run --detach --name minio-ci --network bgg-photo-ci --publish 9000:9000 \
            --env MINIO_ROOT_USER=baby_gallery_minio \
            --env MINIO_ROOT_PASSWORD=baby_gallery_minio_ci_password \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data
          docker run --detach --name minio-public-ci --network bgg-photo-ci --publish 9002:9000 \
            --env WEB_ORIGIN=http://127.0.0.1:5173 --env S3_UPSTREAM=minio-ci:9000 \
            --volume "${{ github.workspace }}/deploy/minio/public-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.29.4-alpine
      - name: Create the private test bucket
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9002/minio/health/live >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3 \
            -c 'mc alias set local http://127.0.0.1:9000 baby_gallery_minio baby_gallery_minio_ci_password && mc mb --ignore-existing local/baby-growth-gallery-ci && mc anonymous set none local/baby-growth-gallery-ci'
      - run: pnpm --filter @baby-growth-gallery/api prisma:generate
      - run: pnpm --filter @baby-growth-gallery/api exec prisma migrate deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Verify no isolated uploads remain
        if: always()
        run: |
          output="$(docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3 \
            -c 'mc alias set local http://127.0.0.1:9000 baby_gallery_minio baby_gallery_minio_ci_password >/dev/null && mc find local/baby-growth-gallery-ci/quarantine --name "*" 2>/dev/null' || true)"
          test -z "$output"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
