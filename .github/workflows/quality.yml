name: Quality

on:
  pull_request:
    branches: [develop, release, master, main]
  push:
    branches: [develop]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baby-growth-gallery/api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify deterministic OpenAPI client
        run: pnpm api:generate && git diff --exit-code -- packages/api-client
      - run: pnpm build
      - name: Validate project knowledge base
        shell: pwsh
        run: ./hooks/validate-project.ps1 -Check

  e2e-auth:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: baby_growth_gallery
          POSTGRES_USER: baby_gallery
          POSTGRES_PASSWORD: baby_gallery_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baby_gallery -d baby_growth_gallery"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://baby_gallery:baby_gallery_test_password@127.0.0.1:5432/baby_growth_gallery
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_KEY_PREFIX: bgg-ci
      AUTH_SESSION_SECRET: ci-session-secret-that-is-not-for-production-use
      AUTH_HMAC_SECRET: ci-hmac-secret-that-is-not-for-production-use-now
      AUTH_COOKIE_SECURE: 'false'
      VERIFICATION_DELIVERY_MODE: fixed
      TEST_VERIFICATION_CODE: '246810'
      WEB_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baby-growth-gallery/api prisma:generate
      - run: pnpm --filter @baby-growth-gallery/api exec prisma migrate deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
