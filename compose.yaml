name: baby-growth-gallery

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baby_growth_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-baby_gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baby_gallery_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8.4-alpine}
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-baby_gallery_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-baby_gallery_minio_dev_password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-baby_gallery_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-baby_gallery_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-baby-growth-gallery-dev}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.20.0-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: 0.1.0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SWAGGER_ENABLED: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-baby_gallery}:${POSTGRES_PASSWORD:-baby_gallery_dev_password}@postgres:5432/${POSTGRES_DB:-baby_growth_gallery}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-baby-growth-gallery-dev}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-baby_gallery_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-baby_gallery_minio_dev_password}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.20.0-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29.4-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
